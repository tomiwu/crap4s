name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run the tests
        run: |
          if [ -f project.scala ]; then scala-cli test .; else echo "No project.scala. Skip the tests."; fi
      - name: Run the CRAP self-check (every unit must have CRAP < 4)
        run: |
          if [ -x scripts/self-crap.sh ]; then scripts/self-crap.sh; else echo "No scripts/self-crap.sh. Skip the self-check."; fi
