name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Check the format
        run: scala-cli fmt --check .
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Compile with warnings as errors
        run: scala-cli compile --test .
      - name: Test the PassThrough rule
        run: scala-cli test scalafix
      - name: Check Scalafix (the PassThrough rule fails on 1 or more findings)
        run: scala-cli --power fix --check .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run the tests
        run: scala-cli test .
  crap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run the CRAP self-check (prints the agent output, fails if a unit has CRAP >= 4)
        run: scripts/self-crap.sh
