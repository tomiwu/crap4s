name: E2E release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  e2e-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run the release artifact on the sample project
        run: scripts/e2e-release.sh
