rules = [
  RemoveUnused,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  RedundantSyntax,
  OrganizeImports,
  "file:scalafix/PassThrough.scala",
  "file:scalafix/NoExtendsCapability.scala",
  "file:scalafix/CapabilityObject.scala",
  "file:scalafix/GivenOnlyInApp.scala",
  "file:scalafix/NoThrow.scala",
  "file:scalafix/NoUncheckedTry.scala",
  "file:scalafix/NoUnsafeCall.scala",
  "file:scalafix/SideEffectsAtEdge.scala"
]
UncheckedTryFiles = ["crap4s/core/Eithers.scala", "crap4s/Effects.scala"]
UncheckedTryGuards = ["crap4s/Effects.scala"]
SideEffectsAllow = ["crap4s/edge/", "crap4s/input/", "crap4s/Main.scala"]
CapabilityStyle = [Units, Coverage, Mapping, Scoring, Report, Terminal, Env]
DisableSyntax {
  noNulls = true
  noReturns = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noXml = true
  noFinalize = true
}
OrganizeImports {
  targetDialect = Scala3
  removeUnused = true
}
