rules = [
  RemoveUnused,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  RedundantSyntax,
  OrganizeImports
]
DisableSyntax {
  noNulls = true
  noReturns = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noXml = true
  noFinalize = true
}
OrganizeImports {
  targetDialect = Scala3
  removeUnused = true
}
